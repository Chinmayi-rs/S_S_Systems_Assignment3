name: GR19 Security CI

# GR-19: every push and pull request runs tests, SAST and a dependency audit.
# The gate job fails unless all three succeed. On GitHub, protect `main` and
# require the check named "GR19 Gate" so a red stage cannot be merged.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: GR19 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  sast:
    name: GR19 Python Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan application
        run: python -m bandit -r app run.py security

  dependencies:
    name: GR19 Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency auditor
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt --strict

  gate:
    name: GR19 Gate
    needs: [tests, sast, dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Block unless every stage passed
        env:
          TESTS: ${{ needs.tests.result }}
          SAST: ${{ needs.sast.result }}
          DEPS: ${{ needs.dependencies.result }}
        run: |
          python -c 'import os,sys; bad={k:os.environ[k] for k in ("TESTS","SAST","DEPS") if os.environ[k]!="success"}; print(bad or "GR-19 all stages passed"); sys.exit(1 if bad else 0)'
