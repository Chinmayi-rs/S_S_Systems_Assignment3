# GR-17: the only client-facing listener. TLS 1.2 and older are not enabled.
# Plain HTTP is never served; it is redirected to TLS 1.3.

server {
    listen 80 default_server;
    server_name localhost;

    return 308 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.3;
    # OpenSSL-level floor, so a TLS 1.2 ClientHello is rejected even if a
    # future ssl_protocols line is widened by mistake.
    ssl_conf_command MinProtocol TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web:8080;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
