services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SECRET_KEY: dev-secret-change-me
      JWT_SECRET_KEY: dev-jwt-secret-change-me
      IDENTITY_DATABASE_URL: sqlite:////app/data/identity.db
      BALLOT_DATABASE_URL: sqlite:////app/data/ballot.db
    tmpfs:
      - /app/data
    restart: unless-stopped

